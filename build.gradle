plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "real_serene_seasons" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile against the matching Fabric API surface of Serene Seasons 1.21.1.
    // The runtime pack can use the NeoForge 10.1.0.9 build through Sinytra Connector.
    modCompileOnly "maven.modrinth:e0bNACJD:qsbPIZeU"
    modCompileOnly "maven.modrinth:s3dmwKy5:lbSHOhee"

    implementation "com.electronwill.night-config:core:${project.nightconfig_version}"
    implementation "com.electronwill.night-config:toml:${project.nightconfig_version}"
    include "com.electronwill.night-config:core:${project.nightconfig_version}"
    include "com.electronwill.night-config:toml:${project.nightconfig_version}"

    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
